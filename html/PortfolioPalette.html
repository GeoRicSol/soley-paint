
<!DOCTYPE html>
<html lang="en-US">
<head>
<title>PortfolioDog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8" />

<style>

body {
	background: rgb(255, 255, 255)  no-repeat fixed center;
	margin: 0;
	font-family: Arial, Helvetica, sans-serif;
	}

.banner {
	background: linear-gradient(180deg,#059ef1,#05f193f3);
	color: #050505;
	padding: 14px 12px;
	text-align: center;
	font-size: 36px;
	font-weight: 700;
	letter-spacing: 0.5px;
    opacity: 0.65;
	box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    font-family: Garamond, serif;
	}


end-of-page {
    margin-bottom: 80px;
}

.gap {
		margin: 3%;
	}

#title {
	text-align: center;
	font-size: 40px;
	font-family: Arial, Helvetica, sans-serif;
	margin-top: 10px;
	margin-bottom: 5px;
}

#artwork {
	width: 88%;
    opacity: 1;
    transition: opacity 0.5s ease;
	border-style: solid;
	border-color: #050505;
	border-width: 3px;
	display: block;
    margin-left: auto;
    margin-right: auto;
}

.fade-out {
    opacity: 0;
}

.btn{
	background-color: #ddfaf3 ;
	text-align: center;
	font-size: 20px;
	margin-left:2px;
	margin-right:2px;
}


#navi{
	background: linear-gradient(180deg,#059ef1,#05f193f3);
	text-align: center;
	box-shadow: 0 2px 6px rgba(0,0,0,0.15);
	width: 90%;
	margin-left: 5%;
}
</style>


</head>
<body>
<div class="gap">

<div class="banner">
    Creative World of Soley-Harris
</div>
</div><div id="navi"><button class= "btn" id="btn1">Start</button><button class= "btn" id="btn2">Prev</button><button class= "btn" id="btn3">Next</button><button class= "btn" id="btn4">End</button></div>
<div id="title">Bailey at Play</div>
<img id="artwork" alt="Artist">

<script src="../js/LoadImgPalette.js"></script>
</body>
</html>
